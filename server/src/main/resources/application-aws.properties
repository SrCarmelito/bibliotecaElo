spring.datasource.url=jdbc:postgresql://db-biblioteca.c78aq4siyt49.sa-east-1.rds.amazonaws.com:5432/
spring.datasource.username=postgres
spring.datasource.password=biblioteca123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

createDatabaseIfNotExist=true

logging.file.name=biblioteca.log
logging.level.web=DEBUG

spring.liquibase.change-log=classpath:/db/master.xml
spring.liquibase.enabled=true

spring.liquibase.default-schema=biblioteca

server.port=8080

mySecretToken=${ALGORITHM_SECRET_TOKEN}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#PARAMETROS DOS SQLS EXECUTADOS
# basic log level for all messages
logging.level.org.hibernate=info
# SQL statements and parameters
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
# Statistics and slow queries
logging.level.org.hibernate.stat=debug
logging.level.org.hibernate.SQL_SLOW=info
# 2nd Level Cache
logging.level.org.hibernate.cache=debug
